name: Release build (arm64)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.7"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        env:
          ZANGETSU_NO_DISCORD: "1"
          ZANGETSU_NIGHTLY: "1"
        run: flutter build apk --release --target-platform android-arm64

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk Zangetsu-Anilife-arm64.apk
          gh release create "build-${{ github.run_number }}" Zangetsu-Anilife-arm64.apk \
            --prerelease \
            --title "Anilife build ${{ github.run_number }}" \
            --notes "Release (AOT) build, arm64 only. Installs alongside normal Zangetsu."
